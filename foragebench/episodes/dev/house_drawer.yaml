# ForageBench dev episode (manifest v0): retrieve the bottle from the kitchen island's bottom drawer (closed at the start;
# the file has the bottle there, beside a rolling pin, item_0).
schema: 3
id: house_drawer
scene:
  id: bear_loop_house  # The scene dataset's release (phygs.scene.fetch); 1.3.0: unique contents, 0.30 m behind the fronts.
  version: 1.3.0
  name: house
  ground: false  # The house has its own floors.
robot:
  model: spot  # phygs/robots/spot; the base spawns at the robot's own height.
  start: [10.14, 5.59, 0.0]  # x, y, heading [m, m, rad]; arm stowed; no collider at 0.02-1.2 m within 0.94 m.
record_view: {eye: [13.5, 4.6, 2.3], target: [11.2, 6.3, 0.6]}  # Clear line of sight to the island.
# What the agent is told (the session gets goal and description, nothing else).
task:
  goal: retrieve
  description: the small dark bottle  # A sealed bottle (the scene's collision_model); not the rolling pin beside it.
observations:
  camera_roles: [planning]  # The robot's arm-planning cameras (Spot: frontleft, frontright, hand).
  joint_state: true
  imu: false
budget:
  sim_seconds: 600
seed: 0
# Hidden: the evaluator reads it, and the oracle through the privileged track's grants; never the agent.
answer:
  target: kitchen_island_compartment_0_item_1  # The scene name of the object to retrieve.
  # Every loose object in scene 1.3.0 is a different model: no other object is this bottle (scene 1.1.0 had three
  # copies, which counted here). Only the target counts; 'small' tells it from the scene's larger dark bottles.
  matches: []
optimal:  # The SPL and SPL-M denominators.
  path_length_m: null  # Until episodes state it (SPL is then not reported).
  manipulations: 2  # Open the drawer, pick.
