# ForageBench dev episode (manifest v0): retrieve the box from the kitchen island's bottom drawer (closed at the start; the
# file has the box there).
schema: 3
id: house_drawer
scene:
  id: bear_loop_house  # The scene dataset's release (phygs.scene.fetch); 1.1.0 is the storage revision.
  version: 1.1.0
  name: house
  ground: false  # The house has its own floors.
robot:
  model: spot  # phygs/robots/spot; the base spawns at the robot's own height.
  start: [10.2, 6.0, 0.0]  # x, y, heading [m, m, rad]; the arm starts stowed.
record_view: {eye: [13.5, 4.6, 2.3], target: [11.2, 6.3, 0.6]}  # Clear line of sight to the island.
# What the agent is told (the session gets goal and description, nothing else).
task:
  goal: retrieve
  description: the small cardboard box
observations:
  camera_roles: [planning]  # The robot's arm-planning cameras (Spot: frontleft, frontright, hand).
  joint_state: true
  imu: false
budget:
  sim_seconds: 600
seed: 0
# Hidden: the evaluator reads it, and the oracle through the privileged track's grants; never the agent.
answer:
  target: kitchen_island_compartment_0_item_1  # The scene name of the object to retrieve.
optimal:  # The SPL and SPL-M denominators.
  path_length_m: null  # Until episodes state it (SPL is then not reported).
  manipulations: 2  # Open the drawer, pick.
