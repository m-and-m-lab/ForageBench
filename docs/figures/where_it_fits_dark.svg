<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="title desc">
<title id="title">Where PhyGS and ForageBench fit</title>
<desc id="desc">Isaac Sim gives physics and rendering; Isaac Lab gives robots, sensors and scenes; PhyGS runs the robot, its skills, the agent session and the task evaluators on scene releases; ForageBench, agents and learned policies use it; the real Spot is outside PhyGS, and agents use the same Spot SDK terms; runs produce recordings, reports and metrics.</desc>
